<style>
.codey-splash {
  color-scheme: light dark;
  --cs-bg: light-dark(#f8f7f5, #131620);
  --cs-ink: light-dark(#202638, #f1f1f8);
  --cs-dim: light-dark(#687083, #a5a9bd);
  --cs-line: light-dark(rgb(39 48 73 / 0.16), rgb(223 227 255 / 0.18));
  --cs-grid: light-dark(rgb(65 77 106 / 0.12), rgb(193 203 244 / 0.1));
  --cs-accent: light-dark(#5268d8, #9aaaff);
  --cs-warm: light-dark(#d18c59, #edb482);
  --cs-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --cs-ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: grid;
  place-items: center;
  overflow: hidden;
  contain: strict;
  background: var(--cs-bg);
  color: var(--cs-ink);
  font-family: "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  cursor: default;
  user-select: none;
  -webkit-app-region: drag;
}
:root:is([data-theme="light"], .light) .codey-splash,
:root:not([data-theme="light"], [data-theme="dark"], .light, .dark) body:is([data-theme="light"], .light) > .codey-splash,
:root:not([data-theme="light"], [data-theme="dark"], .light, .dark) body:not([data-theme="light"], [data-theme="dark"], .light, .dark):has(> #root:is([data-theme="light"], .light)) > .codey-splash { color-scheme: light; }
:root:is([data-theme="dark"], .dark) .codey-splash,
:root:not([data-theme="light"], [data-theme="dark"], .light, .dark) body:is([data-theme="dark"], .dark) > .codey-splash,
:root:not([data-theme="light"], [data-theme="dark"], .light, .dark) body:not([data-theme="light"], [data-theme="dark"], .light, .dark):has(> #root:is([data-theme="dark"], .dark)) > .codey-splash { color-scheme: dark; }
body:has(> .codey-splash) > #root .startup-loader { visibility: hidden; }
.codey-splash *, .codey-splash *::before, .codey-splash *::after { box-sizing: border-box; }
.codey-splash__grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, var(--cs-grid) 0.8px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 54% 50%, #000, transparent 76%);
  pointer-events: none;
}
.codey-splash__aura {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 74% 39%, light-dark(rgb(146 141 212 / 0.1), rgb(129 133 233 / 0.12)), transparent 48%),
    radial-gradient(ellipse at 60% 74%, light-dark(rgb(238 185 133 / 0.13), rgb(201 135 83 / 0.08)), transparent 48%);
  pointer-events: none;
}
.codey-splash__stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: clamp(28px, 5vw, 76px);
  width: min(calc(100% - 112px), 1080px);
}
.codey-splash__copy {
  min-width: 0;
  padding-bottom: 12px;
  animation: codey-splash-rise 850ms var(--cs-ease) 120ms both;
}
.codey-splash__overline {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 25px 5px;
}
.codey-splash__overline i {
  width: 24px;
  height: 4px;
  border-radius: 2px;
  background: var(--cs-accent);
}
.codey-splash__overline i:nth-child(2) { width: 11px; opacity: 0.55; }
.codey-splash__overline i:nth-child(3) { width: 5px; background: var(--cs-warm); }
.codey-splash__mark {
  display: block;
  width: clamp(260px, 34vw, 450px);
  max-width: 100%;
  height: auto;
  margin: 0;
}
.codey-splash__mark stop:first-child { stop-color: light-dark(#3d7de2, #a3c7ff); }
.codey-splash__mark stop:last-child { stop-color: light-dark(#8061c5, #ba9cec); }
.codey-splash__underline {
  width: 56px;
  height: 2px;
  margin: 24px 0 0 5px;
  background: linear-gradient(90deg, var(--cs-accent) 0% 64%, var(--cs-warm) 64%);
}
.codey-splash__meta {
  display: flex;
  flex-direction: column;
  gap: 17px;
  margin: 34px 0 0 5px;
}
.codey-splash__label {
  color: var(--cs-dim);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: 0.13em;
}
.codey-splash__track {
  position: relative;
  display: block;
  width: 180px;
  height: 2px;
  overflow: hidden;
  border-radius: 1px;
  background: var(--cs-line);
}
.codey-splash__track i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 58px;
  border-radius: inherit;
  background: linear-gradient(90deg, transparent, var(--cs-accent), var(--cs-warm));
  animation: codey-splash-comet 1900ms ease-in-out infinite;
}
.codey-splash__art {
  display: grid;
  place-items: center;
  min-width: 0;
  animation: codey-splash-rise 1000ms var(--cs-ease) 200ms both;
}
.codey-splash__art img {
  display: block;
  width: auto;
  height: min(70vh, 550px);
  max-width: 100%;
  object-fit: contain;
  animation: codey-splash-float 4800ms ease-in-out 1200ms infinite alternate;
}
body:has(> #root :is([data-app-navigation-rail], [data-app-action-sidebar-scroll], main button, main a[href], main input, main textarea, main [contenteditable="true"], form button, form input, [role="alert"]:not(:empty)):not([hidden], [hidden] *, [aria-hidden="true"], [aria-hidden="true"] *, [aria-busy="true"], [aria-busy="true"] *)):not(:has(> #root .startup-loader)) > .codey-splash:not([data-codey-splash-managed]),
.codey-splash[data-codey-splash-ready] {
  pointer-events: none;
  animation: codey-splash-exit 520ms var(--cs-ease-quart) forwards;
}
.codey-splash[data-codey-splash-ready] .codey-splash__stage {
  animation: codey-splash-stage-exit 520ms var(--cs-ease-quart) forwards;
}
@keyframes codey-splash-rise { from { opacity: 0; transform: translate3d(0, 14px, 0); } }
@keyframes codey-splash-float { to { transform: translate3d(0, -6px, 0); } }
@keyframes codey-splash-comet {
  from { transform: translateX(-58px); }
  to { transform: translateX(180px); }
}
@keyframes codey-splash-exit { to { opacity: 0; visibility: hidden; display: none; } }
@keyframes codey-splash-stage-exit { to { transform: translate3d(0, -5px, 0); opacity: 0; } }
@media (max-width: 760px) {
  .codey-splash__stage {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    gap: 22px;
    width: calc(100% - 48px);
  }
  .codey-splash__copy { display: flex; flex-direction: column; align-items: center; padding: 0; }
  .codey-splash__overline { margin: 0 0 14px; }
  .codey-splash__mark { width: min(82vw, 340px); }
  .codey-splash__underline { margin: 15px 0 0; }
  .codey-splash__meta { align-items: center; gap: 10px; margin: 18px 0 0; }
  .codey-splash__art img { height: min(49vh, 400px); }
}
@media (max-height: 520px) {
  .codey-splash__stage { width: calc(100% - 48px); gap: 16px; }
  .codey-splash__overline { margin-bottom: 12px; }
  .codey-splash__underline { margin-top: 12px; }
  .codey-splash__meta { margin-top: 18px; gap: 10px; }
  .codey-splash__art img { height: 78vh; }
}
@media (max-width: 760px) and (max-height: 520px) {
  .codey-splash__stage { gap: 12px; }
  .codey-splash__mark { width: min(72vw, 290px); }
  .codey-splash__overline { display: none; }
  .codey-splash__underline { margin-top: 8px; }
  .codey-splash__meta { margin-top: 12px; gap: 8px; }
  .codey-splash__art img { height: 46vh; }
}
@media (prefers-reduced-motion: reduce) {
  .codey-splash *,
  .codey-splash *::before,
  .codey-splash *::after { animation: none !important; }
  .codey-splash__track i { display: none; }
  .codey-splash { animation-duration: 1ms !important; }
}
</style>
