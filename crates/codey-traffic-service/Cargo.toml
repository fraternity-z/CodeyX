[package]
name = "codey-traffic-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
capture = ["dep:mitmproxy", "dep:internet-packet", "dep:windivert-sys", "dep:windows_48", "dep:lru_time_cache"]

[[bin]]
name = "codey-traffic-service"
path = "src/main.rs"
required-features = ["capture"]

[[example]]
name = "traffic-probe"
path = "examples/traffic-probe.rs"
required-features = ["capture"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# Use the existing userspace TCP/IP engine; no custom kernel driver is built.
mitmproxy = { git = "https://github.com/mitmproxy/mitmproxy_rs", rev = "51fe2b7c5aa8439c162abb665db61c6669d146d6", optional = true }
internet-packet = { version = "0.2.4", features = ["checksums"], optional = true }
windivert-sys = { version = "0.10.0", optional = true }
windows_48 = { package = "windows", version = "0.48", features = ["Win32_Foundation"], optional = true }
lru_time_cache = { version = "0.11.11", optional = true }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Memory"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
